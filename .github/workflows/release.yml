# 发布流水线：push tag（v*）触发
#
# 产物命名与 internal/api/system.go pickUpdateAsset 的匹配规则对应：
#   BuddyBot-darwin-arm64.zip                  macOS .app 包（免安装拖入 Applications，应用内自动更新）
#   BuddyBot-darwin-arm64-installer.pkg        macOS 安装器（双击安装到 /Applications）
#   BuddyBot-windows-amd64.exe                 Windows 便携 exe（免安装，应用内自动更新，SignPath 签名）
#   BuddyBot-windows-amd64-installer.exe       Windows NSIS 安装器（开始菜单/桌面快捷方式 + 卸载器）
#   checksums.txt                              全部产物的 sha256（下载后强校验）
#
# 版本号唯一来源 = git tag，经 APP_VERSION → ldflags 注入 internal/api.appVersion。
#
# Windows 代码签名（SignPath Foundation，开源项目免费）：
#   前置条件（一次性，见 SignPath 控制台）：
#     1. 仓库必须有 LICENSE（OSI 认可许可证）→ https://signpath.org/apply 申请
#     2. 安装 SignPath GitHub App 并授权本仓库
#     3. SignPath 控制台添加 GitHub.com 为 Trusted Build System
#   所需 GitHub 配置（Settings → Secrets and variables → Actions）：
#     Secret   SIGNPATH_API_TOKEN            SignPath API Token（Submitter 权限）
#     Variable SIGNPATH_ORGANIZATION_ID      组织 ID（UUID）
#     Variable SIGNPATH_PROJECT_SLUG         项目 slug
#     Variable SIGNPATH_SIGNING_POLICY_SLUG  签名策略 slug（如 release-signing）
#   未配置 secrets 时签名步骤自动跳过，照常发布未签名 exe（不影响现有流程）。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, goos: darwin, goarch: arm64 }
          - { os: windows-2022, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23

      - name: Compute version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build macOS .app
        if: matrix.goos == 'darwin'
        run: |
          wails3 task darwin:package ARCH=${{ matrix.goarch }} APP_VERSION=${{ env.VERSION }}
          ditto -c -k --sequesterRsrc --keepParent \
            bin/BuddyBot.app "bin/BuddyBot-darwin-${{ matrix.goarch }}.zip"
          # pkg 安装器：双击安装到 /Applications（未签名，首次打开需右键 → 打字确认）
          pkgbuild --component bin/BuddyBot.app \
            --install-location /Applications \
            --identifier app.buddybot.desktop \
            "bin/BuddyBot-darwin-${{ matrix.goarch }}-installer.pkg"

      - name: Build Windows portable exe
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          wails3 task windows:build APP_VERSION=${{ env.VERSION }}
          Copy-Item bin/BuddyBot.exe bin/BuddyBot-windows-amd64.exe
          # NSIS 安装器（windows runner 预装 makensis）：开始菜单/桌面快捷方式 + 卸载器
          makensis /V2 /DARCH=amd64 "/DBINDIR=$PWD\bin" build\windows\installer.nsi

      # 上传未签名 exe 供 SignPath 拉取（SignPath Action 只接受 GitHub artifact 输入）
      - name: Upload unsigned Windows exe
        id: upload-unsigned-exe
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-unsigned
          path: bin/BuddyBot-windows-amd64.exe
          if-no-files-found: error

      - name: Sign Windows exe (SignPath)
        if: matrix.goos == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          output-artifact-directory: signed
          wait-for-completion-timeout-in-seconds: "1200"

      - name: Replace exe with signed one
        if: matrix.goos == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $signed) { throw "No signed exe found in signed/" }
          Copy-Item $signed.FullName bin/BuddyBot-windows-amd64.exe -Force
          Write-Host "Replaced with signed exe: $($signed.FullName)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/BuddyBot-darwin-*.zip
            bin/BuddyBot-darwin-*.pkg
            bin/BuddyBot-windows-*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum BuddyBot-* | tee checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
